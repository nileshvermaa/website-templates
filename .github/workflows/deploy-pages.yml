name: Deploy to GitHub Pages (static / Node)

# Manual deploy for static-HTML or Node-built templates.
# Publishes the chosen branch into gh-pages/<branch>/ so every deployed
# template stays live side-by-side, with a regenerated gallery index.
# For PHP/WordPress templates use "Deploy WordPress to GitHub Pages" instead.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Template branch to deploy (e.g. portfolio)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Default checkout = the branch the workflow runs on (main), which holds
      # the composite action used to publish.
      - name: Check out infrastructure (this branch)
        uses: actions/checkout@v4

      # The template lives on another branch — check it out into a subfolder.
      - name: Check out template branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          path: _template

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build (if needed) and locate site directory
        id: build
        shell: bash
        working-directory: _template
        run: |
          set -e
          SITE_DIR="."
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.build ? 0 : 1)"; then
            echo "package.json with a build script found — building."
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm run build
            for d in dist build out; do
              if [ -d "$d" ]; then SITE_DIR="$d"; break; fi
            done
          else
            echo "No build script — treating as a static site."
            for d in public src site; do
              if [ -d "$d" ] && [ -f "$d/index.html" ]; then SITE_DIR="$d"; break; fi
            done
          fi
          echo "Using site directory: _template/$SITE_DIR"
          echo "site_dir=_template/$SITE_DIR" >> "$GITHUB_OUTPUT"

      - name: Publish to gh-pages gallery
        uses: ./.github/actions/publish-to-gh-pages
        with:
          branch: ${{ inputs.branch }}
          source-dir: ${{ steps.build.outputs.site_dir }}
          token: ${{ github.token }}
